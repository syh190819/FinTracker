# FinTracker Nginx 站点配置
# 放置到: /etc/nginx/sites-available/fintracker
# 启用:    ln -s /etc/nginx/sites-available/fintracker /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name luxiaohei.top www.luxiaohei.top;

    # 前端静态文件（构建产物）
    root /opt/fintracker/frontend/dist;
    index index.html;

    # API 反向代理到 Rust 后端
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
